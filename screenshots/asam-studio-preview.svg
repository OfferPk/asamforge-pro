  <text x="765" y="470" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">COMPLIANCE: 100.0% (ASAM_OPENX_CERTIFIED)</text>

  <!-- Audit Checklist items -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
    <text x="760" y="510" fill="#10b981">✓</text>
    <text x="780" y="510" fill="#d1d5db">Gate 1: Continuous Reference Line C1/C2 (OpenDRIVE 1.7)</text>
    
    <text x="760" y="535" fill="#10b981">✓</text>
    <text x="780" y="535" fill="#d1d5db">Gate 2: Clothoid Euler Spiral Transitions (Sec 5.3.4)</text>

    <text x="760" y="560" fill="#10b981">✓</text>
    <text x="780" y="560" fill="#d1d5db">Gate 3: Multi-Lane Width Polynomials (Sec 6.3)</text>

    <text x="760" y="585" fill="#10b981">✓</text>
    <text x="780" y="585" fill="#d1d5db">Gate 4: OpenSCENARIO Storyboard Hierarchy (OpenSCENARIO 1.2)</text>

    <text x="760" y="610" fill="#10b981">✓</text>
    <text x="780" y="610" fill="#d1d5db">Gate 5: Deterministic Relative Distance Triggers (Sec 6.4)</text>

    <text x="760" y="635" fill="#10b981">✓</text>
