  <rect x="765" y="180" width="115" height="70" rx="4" fill="#172033" />
  <text x="775" y="200" fill="#9ca3af" font-size="10">CARLA</text>
  <text x="775" y="225" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">READY</text>
  <text x="775" y="242" fill="#38bdf8" font-size="9">OpenX Export</text>

  <rect x="892" y="180" width="115" height="70" rx="4" fill="#172033" />
  <text x="902" y="200" fill="#9ca3af" font-size="10">CarMaker</text>
  <text x="902" y="225" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">PASS</text>
  <text x="902" y="242" fill="#38bdf8" font-size="9">C1/C2 Smooth</text>

  <rect x="1020" y="180" width="115" height="70" rx="4" fill="#172033" />
  <text x="1030" y="200" fill="#9ca3af" font-size="10">dSPACE</text>
  <text x="1030" y="225" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">COMPLIANT</text>
  <text x="1030" y="242" fill="#38bdf8" font-size="9">HIL Ingestion</text>

  <text x="765" y="280" fill="#d1d5db" font-family="monospace" font-size="11">Road Geometry: Analytical Clothoid Curve</text>
  <text x="765" y="300" fill="#a7f3d0" font-family="monospace" font-size="11">Storyboard Tree: Deterministic Triggers</text>
  <text x="765" y="320" fill="#9ca3af" font-family="monospace" font-size="10">Virtual Mileage Target: Uncapped Automated CI/CD</text>

