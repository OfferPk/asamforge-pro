    <text x="70" y="290" fill="#d1d5db">Clothoid Curvature      : Start Curv: 0.000000 -&gt; End Curv: 0.002000 (C1/C2 Cont)</text>
    <text x="70" y="310" fill="#d1d5db">Lane Cross-Section      : Center (0) + 2 Driving Lanes (-1, -2) @ 3.50m Width</text>

