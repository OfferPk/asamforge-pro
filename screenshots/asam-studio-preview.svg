    <text x="70" y="375" fill="#f472b6">Scenario Act Name       : CutIn_EmergencyBrake_Test</text>
    <text x="70" y="395" fill="#d1d5db">Ego Vehicle Dynamic     : Passenger Car @ 27.78 m/s (100 km/h)</text>
