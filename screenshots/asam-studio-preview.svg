    <text x="70" y="520" fill="#34d399">CARLA Autonomous Sim    : Fully Conforming (.xodr / .xosc ingestion verified)</text>
    <text x="70" y="540" fill="#34d399">IPG CarMaker HIL Bench  : Trajectory Smoothness Validated (No acceleration spikes)</text>
